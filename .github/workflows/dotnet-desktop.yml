name: Build, Test And Create Nuget Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '3 0 * * 0'

jobs:
  main:
    runs-on: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Pin the supported Intel image while hosted macOS ARM capacity is constrained.
          - macos-26-intel
          - ubuntu-latest
          - windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      UNIT_TEST_PROJECT: FossPDF.UnitTests/FossPDF.UnitTests.csproj

    steps:
      - name: 📝 Fetch Sources 📝
        uses: actions/checkout@v7

      - name: ⚙ Setup .NET SDKs ⚙
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          
      - name: 🔄 Restore Nuget Packages 🔄
        shell: bash
        run: dotnet restore
        working-directory: ./Source

      - name: 🛠 Build Solution 🛠
        shell: bash
        run: dotnet build -c Release --no-restore --warnaserror
        working-directory: ./Source

      - name: Install qpdf for PDF optimization coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y qpdf
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install qpdf
          else
            choco install qpdf -y --no-progress
          fi

      - name: Make the installed Windows qpdf available to every validation step
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qpdf = (Get-Command qpdf -ErrorAction SilentlyContinue).Source
          if (-not $qpdf) { $qpdf = Get-ChildItem -LiteralPath $env:ProgramFiles -Directory -Filter 'qpdf*' |
            Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'bin/qpdf.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1 }
          if (-not $qpdf) { throw 'The installed qpdf executable was not found.' }
          Split-Path -Parent $qpdf | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Set up the pinned Python validation runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Java for pinned PDF/A validation
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned veraPDF CLI and verify PDF/A and PDF/UA profile hashes
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/install_verapdf.py --output artifacts/parity/verapdf --github-env "$GITHUB_ENV"
      - name: Install pinned Mustang invoice validator and verify schema/rule hashes
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/install_mustang.py --output artifacts/parity/mustang --github-env "$GITHUB_ENV"
      - name: Run unit tests
        shell: bash
        run: dotnet test "$UNIT_TEST_PROJECT" -c Release --no-build --no-restore --logger trx --results-directory ../artifacts/parity
        working-directory: ./Source

      - name: Inspect PDF layers with an independent reader
        shell: bash
        run: |
          python -m pip install -r Source/FossPDF.NativePrototypes/requirements-validation.txt
          python Source/FossPDF.UnitTests/Parity/verify_pdf_layers.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/PDF-303
      - name: Inspect PDF security with an independent reader
        shell: bash
        run: |
          python -m pip install -r Source/FossPDF.UnitTests/Parity/requirements-security-validation.txt
          python Source/FossPDF.UnitTests/Parity/verify_pdf_security.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/PDF-304
      - name: Inspect attachments and XMP with an independent reader
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/verify_pdf_attachments.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/PDF-305
      - name: Run compression examples and record processing overhead
        shell: bash
        run: dotnet test Source/FossPDF.Examples/FossPDF.Examples.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PdfCompressionExamples --logger trx --results-directory artifacts/parity
      - name: Verify PDF compression and linearization with independent tools
        shell: bash
        run: |
          python -m pip install -r Source/FossPDF.UnitTests/Parity/requirements-compression-validation.txt
          python Source/FossPDF.UnitTests/Parity/verify_pdf_compression.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/PDF-306
      - name: Verify tagged PDF structure with independent tools
        shell: bash
        run: |
          python -m pip install -r Source/FossPDF.UnitTests/Parity/requirements-tagging-validation.txt
          python Source/FossPDF.UnitTests/Parity/verify_pdf_tagging.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/ACC-401 --render
      - name: Verify archival profiles, rendering and expected failures independently
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/verify_pdfa.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/ACC-402
      - name: Verify PDF/UA semantics, rendering and expected failures independently
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/verify_pdfua.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/ACC-403
      - name: Verify e-invoice payloads, metadata, rendering and deliberate failures independently
        shell: bash
        run: python Source/FossPDF.UnitTests/Parity/verify_einvoice.py Source/FossPDF.UnitTests/bin/Release/net9.0/parity-artifacts/ACC-404
      - name: Run .NET 9 settings and accessibility examples
        shell: bash
        run: dotnet test FossPDF.Examples/FossPDF.Examples.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~DocumentSettingsExamples|FullyQualifiedName~AccessiblePdfExamples|FullyQualifiedName~PdfAExamples|FullyQualifiedName~PdfUaExamples|FullyQualifiedName~EInvoiceExamples|FullyQualifiedName~PreviewInspectionExamples" --logger trx --results-directory ../artifacts/parity
        working-directory: ./Source

      - name: Upload test and parity fixture evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-evidence-${{ matrix.environment }}
          path: |
            artifacts/parity/**/*.trx
            artifacts/parity/verapdf/qualification-manifest.json
            artifacts/parity/mustang/qualification-manifest.json
            Source/FossPDF.Examples/bin/Release/net9.0/einvoice-example/**
            Source/FossPDF.Examples/bin/Release/net9.0/preview-inspection-example/**
            Source/FossPDF.Examples/bin/Release/net9.0/pdfa-example/**
            Source/FossPDF.Examples/bin/Release/net9.0/pdfua-example/**
            Source/FossPDF.UnitTests/Resources/AccessibilityReview/**
            Source/FossPDF.UnitTests/bin/Release/net*/parity-artifacts/**
            Source/FossPDF.Examples/bin/Release/net9.0/settings-example/**
            Source/FossPDF.Examples/bin/Release/net9.0/pdf-optimization-*/**
            Source/FossPDF.Examples/bin/Release/net9.0/accessible-*/**
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: ${{ matrix.environment == 'windows-latest' }}
        with:
          name: Build Package
          path: |
            **/*.nupkg
            **/*.snupkg
            !.nuget

  quality:
    name: Quality baselines (${{ matrix.environment }})
    runs-on: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Pin the supported Intel image while hosted macOS ARM capacity is constrained.
          - macos-26-intel
          - ubuntu-latest
          - windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: 📝 Fetch Sources 📝
        uses: actions/checkout@v7

      - name: ⚙ Setup .NET SDK ⚙
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: 🔄 Restore Nuget Packages 🔄
        shell: bash
        run: dotnet restore
        working-directory: ./Source

      - name: 🛠 Build Solution 🛠
        shell: bash
        run: dotnet build -c Release --no-restore --warnaserror
        working-directory: ./Source

      - name: Install qpdf (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Run quality baselines
        shell: bash
        run: dotnet run --project FossPDF.Quality/FossPDF.Quality.csproj -c Release --no-build --no-restore -- --mode all --output ../artifacts/quality
        working-directory: ./Source

      - name: Upload quality evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-evidence-${{ matrix.environment }}
          path: artifacts/quality/**/*

  native-prototypes:
    name: Native backend prototypes (${{ matrix.environment }})
    runs-on: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Pin the supported Intel image while hosted macOS ARM capacity is constrained.
          - macos-26-intel
          - ubuntu-latest
          - windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PROTOTYPE_PROJECT: FossPDF.NativePrototypes/FossPDF.NativePrototypes.csproj

    steps:
      - name: 📝 Fetch Sources 📝
        uses: actions/checkout@v7

      - name: ⚙ Setup .NET SDK ⚙
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: 🔄 Restore Prototype Packages 🔄
        shell: bash
        run: dotnet restore "$PROTOTYPE_PROJECT" --locked-mode
        working-directory: ./Source

      - name: 🛠 Build Prototypes 🛠
        shell: bash
        run: dotnet build "$PROTOTYPE_PROJECT" -c Release --no-restore --warnaserror
        working-directory: ./Source

      - name: Run native backend prototypes
        shell: bash
        run: dotnet run --project "$PROTOTYPE_PROJECT" -c Release --no-build --no-restore -- --output ../artifacts/fp-002
        working-directory: ./Source

      - name: Install independent PDF inspector
        shell: bash
        run: python -m pip install -r Source/FossPDF.NativePrototypes/requirements-validation.txt

      - name: Inspect vector output and semantic associations independently
        shell: bash
        run: python Source/FossPDF.NativePrototypes/verify_artifacts.py artifacts/fp-002

      - name: Audit native assets, notices and locked dependencies
        shell: bash
        run: python Source/FossPDF.NativePrototypes/audit_dependencies.py Source/FossPDF.NativePrototypes/obj/project.assets.json artifacts/fp-002

      - name: Upload prototype evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fp-002-native-prototypes-${{ matrix.environment }}
          path: artifacts/fp-002/**/*
