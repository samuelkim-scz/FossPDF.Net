name: Qualify unchanged main on macOS Intel
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: macos-26-intel
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore FossPDF.Quality/FossPDF.Quality.csproj
        working-directory: Source
      - run: dotnet build FossPDF.Quality/FossPDF.Quality.csproj -c Release --no-restore --warnaserror
        working-directory: Source
      - name: Measure unchanged core with existing tolerances and font pins
        shell: bash
        run: |
          mkdir -p artifacts/qualified-baselines
          cp docs/feature-parity/baselines/visual-baselines.json artifacts/qualified-baselines/
          dotnet run --project Source/FossPDF.Quality/FossPDF.Quality.csproj -c Release --no-build --no-restore -- --mode visual --update-visual-baseline --baseline-dir artifacts/qualified-baselines --output artifacts/quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unchanged-main-macos-intel-quality
          path: artifacts/**/*