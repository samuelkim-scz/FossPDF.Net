name: Build, Test And Create Nuget Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '3 0 * * 0'

jobs:
  main:
    runs-on: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      UNIT_TEST_PROJECT: FossPDF.UnitTests/FossPDF.UnitTests.csproj

    steps:
      - name: 📝 Fetch Sources 📝
        uses: actions/checkout@v7

      - name: ⚙ Setup .NET SDKs ⚙
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          
      - name: 🔄 Restore Nuget Packages 🔄
        shell: bash
        run: dotnet restore
        working-directory: ./Source

      - name: 🛠 Build Solution 🛠
        shell: bash
        run: dotnet build -c Release --no-restore --warnaserror
        working-directory: ./Source

      - name: Run unit tests
        shell: bash
        run: dotnet test "$UNIT_TEST_PROJECT" -c Release --no-build --no-restore --logger trx --results-directory ../artifacts/parity
        working-directory: ./Source

      - name: Run .NET 9 settings consumer example
        shell: bash
        run: dotnet test FossPDF.Examples/FossPDF.Examples.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~DocumentSettingsExamples --logger trx --results-directory ../artifacts/parity
        working-directory: ./Source

      - name: Upload test and parity fixture evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-evidence-${{ matrix.environment }}
          path: |
            artifacts/parity/**/*.trx
            Source/FossPDF.UnitTests/bin/Release/net*/parity-artifacts/**
            Source/FossPDF.Examples/bin/Release/net9.0/settings-example/**
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: ${{ matrix.environment == 'windows-latest' }}
        with:
          name: Build Package
          path: |
            **/*.nupkg
            **/*.snupkg
            !.nuget
